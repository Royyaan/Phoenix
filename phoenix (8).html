function genKodeKata(){
  const arr = new Uint32Array(4);
  crypto.getRandomValues(arr);
  const picks = Array.from(arr).map(v => KBBI_WORDS[v % KBBI_WORDS.length]);
  return picks.join("-");
}

function parseKodeWords(s){
  if(!s) return [];
  return s.toLowerCase().trim().split("-").map(w=>w.trim()).filter(w=>w.length>0);
}

  const ephemeralPresenceKey=Df();
  const ch=supabaseClient.channel(`ob256-${targetId}`, {config:{presence:{key:ephemeralPresenceKey}, broadcast:{self:false}}});
  channelRef.current=ch;

  async function processIncoming(payload){
    try{
      const L=payload;
      if(!L||!L._delima) return;
      if(L.type==="typing"){ setTyping(!!L.val); return; }
      if(L.type==="end"){ 
        try{ channelRef.current?.unsubscribe(); }catch{}
        channelRef.current=null;
        doWipe();
        return; 
      }
      if(L.type==="ecdh-pub"){ await handleEcdh(L.pub); return; }
      if(L.type==="auth"){
        if(L.token!==tokenRef.current){ await ch.unsubscribe(); setU(false); return; }
        return;
      }
      if(L.type==="enc"){
        const r=ratchet.current;
        if(!r.RK) return;
        try{
          const h=L.header;
          const dec=await Rm(r,h,L.iv,L.ct);
          setStatusMsg("");
          if(dec.type==="end"){ 
            try{ channelRef.current?.unsubscribe(); }catch{}
            channelRef.current=null;
            doWipe();
            return; 
          }
          if(dec.type==="typing"){ setTyping(!!dec.val); return; }
          if(dec.text && dec.text.length>2000){ return; }
          if(dec.type==="msg"){ const rnow=Date.now(); setMsgs(m=>[...m,{id:dec.id,text:dec.text,from:"them",time:rnow}]); setTyping(false); return; }
        }catch{}
      }
    }catch{}
  }

  ch.on("broadcast",{event:"delima-msg"}, ({payload})=>{
    incomingQueueRef.current = incomingQueueRef.current.then(()=>processIncoming(payload)).catch(()=>{});
  });

  // FIX GROK: initiator ditentukan oleh siapa paling dulu di waiting room
    ch.on("presence",{event:"sync"}, ()=>{
    // FIX ABSOLUT: Presence tidak lagi menentukan role cryptography.
    // Role sekarang 100% deterministik berdasarkan perbandingan B64 public key
    // di handleEcdh, jadi sync ini hanya untuk observability, tidak mengubah isInitiator.
    try{
      const state = ch.presenceState();
      //
    }catch{}
  });

  // Presence fix: If peer A published pub_A before peer B joined, B would miss it.
  // Solution: Broadcast public key on every new presence join ulang pub kita biar yang baru join dapat.
  ch.on("presence",{event:"join"}, async ()=>{
    try{
      await ensureKeys();
      const pub = ratchet.current.DHs?.b64;
      if(pub && channelRef.current){
        await channelRef.current.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"ecdh-pub",pub}});
      }
    }catch{}
  });

  ch.on("presence",{event:"leave"},()=>{ try{ channelRef.current?.unsubscribe(); }catch{} channelRef.current=null; doWipe(); });

  ch.subscribe(async (s)=>{
    if(s==="SUBSCRIBED"){
      try{
        // FIX ABSOLUT: Jangan tentukan role dari presence countBefore (rentan jitter).
        // Role = null dulu, akan diputuskan deterministik di handleEcdh saat kedua pubkey sudah ada:
        //   myPubB64 < theirPubB64  => Initiator (yang kecil)
        //   myPubB64 > theirPubB64  => Joiner (yang besar)
        // Ini 100% identik di kedua sisi tanpa tergantung urutan network.
        isInitiator.current = null;
        await ensureKeys();
        const pub=ratchet.current.DHs.b64;
        await ch.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"ecdh-pub",pub}});
        await ch.track({online:true, joinedAt: Date.now()});
        setStatusMsg("");
      }catch(e){ console.error(e); setStatusMsg("Gagal konek: "+(e?.message||e)); }
    }
    if(s==="CHANNEL_ERROR"||s==="TIMED_OUT"){ setStatusMsg("Koneksi realtime gagal ("+s+")"); }
  });
}

async function handleEcdh(pubB64){
  try{
    const raw=xe.toBuf(pubB64);
    const pub=await Vf(raw);
    const obj={pub,pubRaw:raw,b64:pubB64};
    await ensureKeys();
    const myB64 = ratchet.current.DHs?.b64;
    if(!myB64){ console.warn("myB64 belum siap"); return; }
    if(myB64 === pubB64) return; // abaikan echo diri sendiri

    // === FIX ABSOLUT: Deterministik Berdasarkan Nilai Kunci B64 ===
    // Tanpa presence, tanpa timing. Siapa B64 lebih kecil = Initiator, lebih besar = Joiner.
    // Ini 100% identik di kedua belah pihak terlepas dari jitter / urutan paket.
    if(ratchet.current.RK && ratchet.current.DHr){
      // Sudah handshake, ini adalah ratchet step (DH ratchet)
      if(ratchet.current.DHr.b64 !== pubB64){
        const raw2=xe.toBuf(pubB64);
        const pub2=await Vf(raw2);
        await Dm(ratchet.current, pubB64, pub2, raw2);
        setU(true); setStatusMsg(""); setLink("");
        try{
          const newPub2 = ratchet.current.DHs.b64;
          await channelRef.current.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"ecdh-pub",pub:newPub2}});
        }catch{}
      }
      return;
    }

    // Belum ada RK = fase handshake awal, tentukan role sekarang
    if(isInitiator.current === null){
      const amIInitiator = myB64 < pubB64; // leksikografis B64
      isInitiator.current = amIInitiator;
    }

    if(!isInitiator.current && !ratchet.current.RK){
      // Saya Joiner (B64 saya lebih besar)
      const shared=await so(ratchet.current.DHs.priv, pub);
      const res=await Im(shared,obj);
      ratchet.current=res;
      try{
        const newPub = ratchet.current.DHs.b64;
        await channelRef.current.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"ecdh-pub",pub:newPub}});
      }catch{}
      await channelRef.current.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"auth",token:tokenRef.current}});
      setU(true); setStatusMsg(""); setLink("");
      return;
    }
    if(isInitiator.current && !ratchet.current.RK && !ratchet.current.DHr){
      // Saya Initiator (B64 saya lebih kecil)
      const shared=await so(ratchet.current.DHs.priv, pub);
      const res=Um(shared, ratchet.current.DHs);
      ratchet.current=res;
      const myPub=ratchet.current.DHs.b64;
      await channelRef.current.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"ecdh-pub",pub:myPub}});
      await channelRef.current.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"auth",token:tokenRef.current}});
      setU(true); setStatusMsg(""); setLink("");
      return;
    }
  }catch(e){ console.error(e); setStatusMsg("Gagal handshake: "+(e?.message||e)); }
}

async function sendEnc(payload){
  const r=ratchet.current;
  if(!r.CKs||!r.ready){ return false; }
  try{
    const enc=await Om(r,payload);
    await channelRef.current.send({type:"broadcast", event:"delima-msg", payload:{_delima:true,type:"enc",iv:enc.iv,ct:enc.ct,header:enc.header}});
    return true;
  }catch{ return false; }
}

async function buatKode(){
  let raw = (kode||"").trim().toLowerCase() || genKodeKata();
  const words = raw.split("-").map(s=>s.trim().toLowerCase()).filter(s=>s.length>0);
  if(words.length < 4){ setStatusMsg("Kode minimal 4 kata"); return; }
  // normalisasi: buang spasi / hyphen dobel / trailing hyphen
  const normalized = words.join("-");
  // pakai normalized untuk proses selanjutnya
  // raw = normalized  -> kita set ulang
  raw = normalized;
  setLoading(true);
  setStatusMsg("Membuka ruangan...");
  try{
    const {address} = await Af(raw);
    const channelId = address.slice(0,24);
    const derivedToken = address.slice(24,48);
    tokenRef.current = derivedToken;
    // FIX: jangan tentukan initiator di sini lagi. Biarkan connectTo yang tentukan berdasarkan siapa dulu masuk waiting.
    setLink("menunggu");
    setY("main");
    setKode(raw);
    setStatusMsg("");
    await connectTo(channelId);
  }catch(e){ setStatusMsg("Gagal: "+(e?.message||e)); }
  finally{ setLoading(false); }
}
